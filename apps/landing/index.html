<!DOCTYPE html>
<html class="dark" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#0f1015"/>

<!-- SEO -->
<title>{{ sayfaBasligi }}</title>
<meta name="description" content="{{ sayfaAciklamasi }}"/>
<meta name="robots" content="index, follow"/>

<!-- Open Graph / Twitter
     TODO(mutlak-og-url): og:image ideal olarak mutlak adres olmalı. Yayın
     alan adı kesinleştiğinde buraya tam URL yazılmalı. -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="{{ markaAdi }}"/>
<meta property="og:title" content="{{ sayfaBasligi }}"/>
<meta property="og:description" content="{{ sayfaAciklamasi }}"/>
<meta property="og:image" content="{{ ogGorsel }}"/>
<meta property="og:image:alt" content="{{ ogGorselAlt }}"/>
<meta property="og:locale" content="tr_TR"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ sayfaBasligi }}"/>
<meta name="twitter:description" content="{{ sayfaAciklamasi }}"/>
<meta name="twitter:image" content="{{ ogGorsel }}"/>

<!-- Tipografi: Inter (gövde) + Outfit (başlık).
     Vanilla Vite kurulumunda next/font yok; en performanslı yol preconnect +
     display=swap ile tek istek. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="/src/tailwind.css" rel="stylesheet"/>
<!-- JavaScript kapalıysa mobil menü paneli açılamayacağı için doğrudan
     görünür yapılır; böylece navigasyon her koşulda erişilebilir kalır. -->
<noscript><style>@media (max-width:767px){#mobil-menu{display:block!important}#mobil-menu-dugmesi{display:none!important}}</style></noscript>
</head>

<body class="relative overflow-x-hidden font-govde antialiased">
<!-- Ortam ışıkları ve ızgara arka planı (dekoratif).
     Hepsi taşmayı kesen sabit bir katmanda: aksi halde vw genişliğindeki
     ışık blobları belgenin genişliğini büyütüp mobilde yatay kaydırma açıyor. -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
  <div class="zemin-izgara absolute inset-0"></div>
  <div class="hale hale--ust-sol"></div>
  <div class="hale hale--ust-sag"></div>
  <div class="hale hale--orta"></div>
  <div class="hale hale--alt"></div>
  <div class="doku-gren absolute inset-0"></div>
</div>

<a class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-marka-turuncu-500 focus:px-4 focus:py-2 focus:text-white" href="#icerik">
  İçeriğe geç
</a>

<!-- parca: ustbar -->

<main id="icerik">
  <!-- parca: hero -->
  <!-- parca: panel-onizleme -->
  <!-- parca: konsept-seridi -->
  <!-- parca: ozellikler -->
  <hr class="ayirac mx-auto max-w-6xl"/>
  <!-- parca: nasil-calisir -->
  <!-- parca: yorumlar -->
  <hr class="ayirac mx-auto max-w-6xl"/>
  <!-- parca: fiyatlandirma -->
  <hr class="ayirac mx-auto max-w-3xl"/>
  <!-- parca: sss -->
  <!-- parca: cta -->
</main>

<!-- parca: altbilgi -->

<script type="module" src="/src/arayuz.js"></script>
<script type="module" src="/src/animasyonlar.js"></script>
</body>
</html>
