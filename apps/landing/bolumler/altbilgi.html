<!-- ==========================================================================
     MasanPOS gece restoranı — kurumsal bilgi ve operasyon akışını birleştiren
     özgün, panoramik alt bilgi.
     ========================================================================== -->
<footer class="masanpos-altbilgi" id="altbilgi">
  <div class="altbilgi-icerik">
    <div class="altbilgi-ana">
      <section class="altbilgi-marka" aria-labelledby="altbilgi-marka-baslik">
        <a class="altbilgi-logo" href="#ust" aria-label="MasanPOS — sayfa başına dön">
          <img class="altbilgi-logo-gorseli marka-logo-gorseli--acik" src="/gorseller/masanpos-logo.webp" alt="MasanPOS" width="900" height="141" loading="lazy" decoding="async"/>
          <img class="altbilgi-logo-gorseli marka-logo-gorseli--koyu" src="/gorseller/masanpos-logo-dark.webp" alt="" width="900" height="141" loading="lazy" decoding="async" aria-hidden="true"/>
        </a>
        <h2 class="sr-only" id="altbilgi-marka-baslik">MasanPOS</h2>
        <p>{{ markaAciklamasi }}</p>
      </section>

      <nav class="altbilgi-menusu" aria-label="Alt bilgi menüsü">
        {{ altbilgiKolonlariHtml }}
        {{ altbilgiIletisimHtml }}
      </nav>
    </div>

    <div class="altbilgi-ayrac" aria-hidden="true"></div>

    <div class="altbilgi-alt">
      <p>{{ telifSatiri }}</p>
    </div>
  </div>

  <figure class="altbilgi-sahne" aria-label="MasanPOS ile yönetilen restoran operasyonu">
    <img class="altbilgi-sahne-gorseli altbilgi-sahne-gorseli--gunduz" src="/gorseller/masanpos-gunduz-restoran-v2.png" alt="Gündüz açık olan modern restoranın salon, mutfak ve kasa alanları" width="2022" height="778" loading="lazy" decoding="async"/>
    <img class="altbilgi-sahne-gorseli altbilgi-sahne-gorseli--gece" src="/gorseller/masanpos-gece-restoran-v2.png" alt="Gece açık olan modern restoranın salon, mutfak ve kasa alanları" width="2022" height="778" loading="lazy" decoding="async"/>
    <div class="altbilgi-sahne-perde" aria-hidden="true"></div>
  </figure>
</footer>
