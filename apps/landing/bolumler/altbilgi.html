<footer class="border-t border-marka-cizgi bg-marka-zemin px-6 py-12">
  <div class="mx-auto flex max-w-7xl flex-col items-center gap-10 md:flex-row md:items-start md:justify-between">
    <div class="flex flex-col items-center gap-3 md:items-start">
      <a class="menule-logo flex items-center gap-2.5" href="#ust">
        <img class="h-9 w-9" src="/gorseller/menule-mark.svg" alt="" width="36" height="36" loading="lazy" decoding="async"/>
        <span class="menule-wordmark font-baslik text-xl font-bold tracking-[-0.045em]">{{ markaAdiHtml }}</span>
      </a>
      <p class="max-w-xs text-center text-sm text-marka-gri-400 md:text-left">{{ markaAciklamasi }}</p>
    </div>

    <nav class="grid grid-cols-2 gap-10 text-center sm:grid-cols-4 sm:gap-12 md:text-left" aria-label="Alt bilgi menüsü">
      {{ altbilgiKolonlariHtml }}
      {{ altbilgiIletisimHtml }}
    </nav>
  </div>

  <div class="mx-auto mt-10 max-w-7xl border-t border-marka-kenar-hafif pt-6 text-center">
    <p class="text-sm text-marka-gri-400">{{ telifSatiri }}</p>
  </div>
</footer>
