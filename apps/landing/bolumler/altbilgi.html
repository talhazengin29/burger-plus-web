<!-- ==========================================================================
     MasanPOS kompakt alt bilgi.
     Restoran operasyonu görseli ayrı bir vitrin olmak yerine yüzeyin içinde,
     düşük yoğunluklu bir marka dokusu olarak kullanılır.
     ========================================================================== -->
<footer class="masanpos-altbilgi" id="altbilgi">
  <img
    class="altbilgi-ambiyans"
    src="/gorseller/masanpos-gece-servisi.webp"
    alt=""
    width="1920"
    height="739"
    loading="lazy"
    decoding="async"
    aria-hidden="true"
  />

  <div class="altbilgi-icerik">
    <div class="altbilgi-ana">
      <section class="altbilgi-marka" aria-labelledby="altbilgi-marka-baslik">
        <a class="altbilgi-logo" href="#ust" aria-label="MasanPOS — sayfa başına dön">
          <img class="altbilgi-logo-gorseli" src="/gorseller/masanpos-logo-dark.webp" alt="MasanPOS" width="900" height="141" loading="lazy" decoding="async"/>
        </a>
        <h2 class="sr-only" id="altbilgi-marka-baslik">MasanPOS</h2>
        <p>{{ markaAciklamasi }}</p>
        <a class="altbilgi-ana-aksiyon" href="#iletisim">
          Kurulum görüşmesi
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </section>

      <nav class="altbilgi-menusu" aria-label="Alt bilgi menüsü">
        {{ altbilgiKolonlariHtml }}
        {{ altbilgiIletisimHtml }}
      </nav>
    </div>

    <div class="altbilgi-alt">
      <p>{{ telifSatiri }}</p>
      <ol class="altbilgi-operasyon" aria-label="MasanPOS sipariş akışı">
        <li><span aria-hidden="true"></span>Masa</li>
        <li><span aria-hidden="true"></span>Mutfak</li>
        <li><span aria-hidden="true"></span>Servis</li>
        <li><span aria-hidden="true"></span>Kasa</li>
      </ol>
      <p class="altbilgi-sistem-durumu"><span aria-hidden="true"></span>Tüm sistemler çalışıyor</p>
    </div>
  </div>
</footer>
