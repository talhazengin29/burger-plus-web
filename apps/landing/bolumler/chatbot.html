<!-- Landing satış asistanı: API anahtarı istemcide değil, backend endpoint'indedir. -->
<aside class="chatbot-kok" id="chatbot-kok" aria-label="MasanPOS satış asistanı">
  <section class="chatbot-panel" id="chatbot-panel" aria-labelledby="chatbot-baslik" hidden>
    <header class="chatbot-baslik-satiri">
      <span class="chatbot-avatar" aria-hidden="true">
        <img class="chatbot-avatar-gorseli" src="/gorseller/masanpos-symbol.png" alt="" width="512" height="512"/>
      </span>
      <div>
        <h2 id="chatbot-baslik"><span class="chatbot-marka">MasanPOS</span> Asistan</h2>
        <p><span aria-hidden="true"></span> Çevrimiçi</p>
      </div>
      <button class="chatbot-kapat" id="chatbot-kapat" type="button" aria-label="Sohbeti kapat">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="chatbot-mesajlar" id="chatbot-mesajlar" role="log" aria-live="polite" aria-relevant="additions">
      <div class="chatbot-mesaj chatbot-mesaj--asistan">Merhaba! Fiyatlar, özellikler, kurulum veya ücretsiz deneme hakkında yardımcı olabilirim.</div>
    </div>

    <div class="chatbot-oneriler" id="chatbot-oneriler" aria-label="Önerilen sorular">
      <button type="button" data-chat-soru="Paket fiyatları ne kadar?">Paket fiyatları</button>
      <button type="button" data-chat-soru="14 gün ücretsiz deneme nasıl çalışıyor?">Ücretsiz deneme</button>
      <button type="button" data-chat-soru="Kurulum nasıl yapılıyor?">Kurulum</button>
    </div>

    <form class="chatbot-form" id="chatbot-form">
      <label class="sr-only" for="chatbot-girdi">Mesajınız</label>
      <textarea id="chatbot-girdi" name="mesaj" rows="1" maxlength="600" placeholder="Bir şey sorun..." required></textarea>
      <button type="submit" aria-label="Mesajı gönder">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 4 16 8-16 8 2.5-8L4 4Zm2.5 8H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="chatbot-not">AI desteklidir; özel veya finansal bilgi paylaşmayın.</p>
  </section>

  <button class="chatbot-ac" id="chatbot-ac" type="button" aria-label="MasanPOS canlı desteğini aç" aria-expanded="false" aria-controls="chatbot-panel">
    <img class="chatbot-ac-gorseli" src="/gorseller/masanpos-symbol.png" alt="" width="512" height="512" aria-hidden="true"/>
    <i class="chatbot-durum" aria-hidden="true"></i>
  </button>
</aside>
