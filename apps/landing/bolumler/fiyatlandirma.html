<!-- ==========================================================================
     Fiyatlandırma — paketler src/icerik.js → PAKETLER içinde tanımlı.
     ========================================================================== -->
<section class="relative px-6 py-20 md:py-24" id="fiyatlandirma">
  <div class="mx-auto max-w-6xl">
    <div class="bolum-basligi mb-14 text-center">
      <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-marka-gri-400">{{ fiyatEtiket }}</p>
      <h2 class="font-baslik text-3xl font-bold md:text-5xl">
        <span class="metin-akan">{{ fiyatBaslik }}</span><br/><span class="metin-gradyan">{{ fiyatVurgu }}</span>
      </h2>
      <p class="mx-auto mt-5 max-w-2xl text-sm leading-relaxed text-marka-gri-300 md:text-base">
        {{ fiyatAciklama }}
      </p>
    </div>

    {{ denemeSeridiHtml }}

    <div class="mb-10 flex justify-center">
      <div id="fiyat-anahtari" class="cam-panel inline-flex items-center gap-1 rounded-full p-1" role="group" aria-label="Ödeme periyodu">
        <button type="button" class="fiyat-anahtar-dugme fiyat-anahtar-dugme--aktif" data-periyot="aylik" aria-pressed="true">Aylık</button>
        <button type="button" class="fiyat-anahtar-dugme" data-periyot="yillik" aria-pressed="false">
          Yıllık<span class="fiyat-anahtar-rozet">{{ YILLIK_BEDAVA_AY }} Ay Hediye</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-3 md:items-start">
      {{ paketKartlariHtml }}
    </div>
  </div>
</section>
