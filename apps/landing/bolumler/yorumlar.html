<section class="relative px-6 py-20 md:py-24" id="yorumlar">
  <div class="mx-auto max-w-6xl">
    <div class="bolum-basligi mb-14 text-center">
      <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-marka-gri-400">{{ yorumlarEtiket }}</p>
      <h2 class="font-baslik text-3xl font-bold md:text-5xl">
        <span class="metin-akan">{{ yorumlarBaslik }}</span><br/><span class="metin-gradyan">{{ yorumlarVurgu }}</span>
      </h2>
    </div>

    <!-- Kesintisiz kayan şerit. Üzerine gelince veya klavye odağı içine
         girince durur; hareket azaltma tercihinde hiç akmaz. -->
    <div class="yorum-serit">
      <div class="yorum-akis">
        {{ yorumKartlariHtml }}
        {{ yorumKartlariKopyasiHtml }}
      </div>
    </div>
  </div>
</section>
