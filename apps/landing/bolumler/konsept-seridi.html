<!-- ==========================================================================
     Konsept şeridi.
     Tasarımdaki müşteri logosu şeridinin yerine, backend'in gerçekten
     desteklediği konseptler ve ödeme altyapısı gösteriliyor (uydurma
     referans logosu kullanılmadı).
     ========================================================================== -->
<section class="border-y border-marka-cizgi/50 bg-black/20 py-10" aria-labelledby="konsept-seridi-basligi">
  <h2 class="sr-only" id="konsept-seridi-basligi">{{ konseptSeridiEtiket }}</h2>
  <ul class="mx-auto grid max-w-5xl grid-cols-2 items-center justify-items-center gap-6 px-6 text-marka-gri-300 opacity-70 transition-opacity duration-500 hover:opacity-100 sm:flex sm:flex-wrap sm:justify-center sm:gap-8 md:justify-between">
    {{ konseptSeridiHtml }}
  </ul>
</section>
