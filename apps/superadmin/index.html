<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />

    <!-- Tipografi: Inter, değişken ağırlık aralığıyla (arayüz CSS'i 650/750/850
         gibi ara ağırlıklar kullanıyor). Font hiç yüklenmediğinde tarayıcı
         sistem fontuna (Segoe UI) düşüyor, bu da küçük puntolarda (7-11px)
         basık görünüyordu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet" />
    <title>Platform Yönetimi</title>

    <!-- Tema tercihini CSS/boya işleminden ÖNCE uygula — aksi halde bir anlık
         yanlış tema (FOUC) görülür. Varsayılan koyu (mevcut davranış). -->
    <script>
      (function () {
        try {
          var kayitli = localStorage.getItem("bp-superadmin-tema");
          var koyu = kayitli ? kayitli === "dark" : true;
          document.documentElement.classList.toggle("dark", koyu);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
